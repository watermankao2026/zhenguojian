name: Build Android x86_64

on:
  workflow_dispatch:          # 手动触发
  

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"
          cache: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          # 不要包含已废弃的 tools 包
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358

      - name: Accept remaining SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Show environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          flutter --version
          go version
          java -version

      - name: Build Android x86_64 (all sources)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: off
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          python3 scripts/build_android.py --abi x86_64 --all-sources

      - name: List outputs
        if: always()
        run: |
          echo "=== dist/android ==="
          ls -la dist/android 2>/dev/null || true
          echo "=== flutter-apk ==="
          ls -la build/app/outputs/flutter-apk 2>/dev/null || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-android-x86_64
          path: |
            dist/android/**
            build/app/outputs/flutter-apk/*x86_64*.apk
            build/app/outputs/flutter-apk/*x64*.apk
          if-no-files-found: warn
          retention-days: 14
