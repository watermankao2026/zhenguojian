name: Build Android x86_64

on:
  workflow_dispatch:   # 手动触发
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"

      - name: Build x86_64
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          python3 scripts/build_android.py --abi x86_64 --all-sources

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-x86_64
          path: dist/android/*.apk
